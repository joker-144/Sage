<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;">
<title>Sage 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0e14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e6e6e6;
    user-select: none;
    -webkit-user-select: none;
  }
  .splash {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
  }
  /* Logo 容器 — 160x160，带柔和发光 */
  .logo-wrap {
    width: 120px; height: 120px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-wrap::before {
    content: '';
    position: absolute; inset: -20px;
    background: radial-gradient(circle, rgba(0, 212, 170, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    animation: glow 2.4s ease-in-out infinite;
  }
  .logo-icon {
    width: 72px; height: 72px;
    position: relative; z-index: 1;
  }
  /* 加载圆环 — SVG 旋转 */
  .spinner {
    position: absolute;
    width: 120px; height: 120px;
    z-index: 0;
  }
  .spinner circle {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    transform-origin: 50% 50%;
  }
  .spinner .track { stroke: rgba(255, 255, 255, 0.06); }
  .spinner .bar {
    stroke: #00d4aa;
    stroke-dasharray: 60, 200;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  /* 标题 */
  .title {
    font-size: 22px; font-weight: 600;
    letter-spacing: 2px;
    color: #f0f0f0;
  }
  .version {
    font-size: 12px; color: #6b7280;
    margin-top: -20px;
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  /* 动态阶段文案 */
  .status {
    font-size: 13px; color: #9ca3af;
    min-height: 20px;
    display: flex; align-items: center; gap: 8px;
    transition: opacity 0.3s ease;
  }
  .status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00d4aa;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  /* 三点加载指示器（备用） */
  .dots { display: flex; gap: 6px; margin-top: -12px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #00d4aa;
    animation: dots-bounce 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dots-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="splash">
  <div class="logo-wrap">
    <svg class="spinner" viewBox="0 0 120 120">
      <circle class="track" cx="60" cy="60" r="54"/>
      <circle class="bar" cx="60" cy="60" r="54"/>
    </svg>
    <svg class="logo-icon" viewBox="0 0 72 72" fill="none">
      <!-- 书本 + 叶芽 (Sage 智慧 + 生长) -->
      <path d="M12 18 Q12 12 18 12 L36 12 Q36 18 42 18 L60 18 Q66 18 66 24 L66 54 Q66 60 60 60 L18 60 Q12 60 12 54 Z"
            fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M36 12 L36 48 Q36 54 30 54 L18 54"
            fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M48 30 Q54 30 54 36 Q54 42 48 42 Q44 42 44 36 Q44 30 48 30 Z"
            fill="#00d4aa" opacity="0.8"/>
      <path d="M48 42 L48 50" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div class="title">Sage</div>
    <div class="version" id="version"></div>
  </div>
  <div class="status" id="status">正在初始化...</div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const versionEl = document.getElementById('version');

  // 从 URL query 读取版本号
  const params = new URLSearchParams(location.search);
  versionEl.textContent = params.get('v') ? `v${params.get('v')}` : '';

  // 接收主进程推送的阶段文案更新（通过 preload 注入的 electronAPI）
  if (window.electronAPI && window.electronAPI.onSplashStatus) {
    window.electronAPI.onSplashStatus((text) => {
      statusEl.style.opacity = '0';
      setTimeout(() => {
        statusEl.textContent = text;
        statusEl.style.opacity = '1';
      }, 200);
    });
  }
</script>
</body>
</html>
