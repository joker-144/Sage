<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline'">
<title>Sage 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #03070d 0%, #071120 52%, #0b1a2c 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e8ecf4;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── 舞台 ─────────────────────────────────────────── */
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* 极光带：两条缓慢流动的青色光带，思想的辉光 */
  .aurora { position: absolute; width: 150vmax; height: 42vmax; border-radius: 50%; filter: blur(46px); pointer-events: none; }
  .aurora.a1 { top:-18vmax; left:-30vmax; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,212,170,0.14) 0%, transparent 70%); transform: rotate(-16deg); animation: auroraA 14s ease-in-out infinite; }
  .aurora.a2 { bottom:-20vmax; right:-34vmax; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(56,150,255,0.10) 0%, transparent 70%); transform: rotate(14deg); animation: auroraB 19s ease-in-out infinite; }
  @keyframes auroraA {
    0%,100% { transform: rotate(-16deg) translateX(0)      scale(1);    opacity: .8; }
    50%     { transform: rotate(-12deg) translateX(6vmax)  scale(1.12); opacity: 1; }
  }
  @keyframes auroraB {
    0%,100% { transform: rotate(14deg)  translateX(0)      scale(1);    opacity: .7; }
    50%     { transform: rotate(10deg)  translateX(-7vmax) scale(1.1);  opacity: 1; }
  }

  /* 细网格：学术坐标纸，中心放射遮蔽 */
  .bg-grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(rgba(0,212,170,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 0%, rgba(0,0,0,0.5) 48%, transparent 78%);
            mask-image: radial-gradient(circle at 50% 46%, #000 0%, rgba(0,0,0,0.5) 48%, transparent 78%);
  }

  /* 学术词汇流：左右两侧极淡竖排词列，如知识星河 */
  .lexicon { position: absolute; top:0; bottom:0; display:flex; align-items:center; pointer-events:none; overflow:hidden; }
  .lexicon .rail { writing-mode: vertical-rl; font-size:12px; letter-spacing:.8em; white-space:nowrap; color:rgba(0,212,170,0.075); font-weight:600; }
  .lexicon.left  { left:4.5%; } .lexicon.right { right:4.5%; }
  .lexicon.left  .rail { animation: lexUp   30s linear infinite; }
  .lexicon.right .rail { animation: lexDown 34s linear infinite; color: rgba(125,227,195,0.06); }
  @keyframes lexUp   { from { transform: translateY(50%);  } to { transform: translateY(-50%); } }
  @keyframes lexDown { from { transform: translateY(-50%); } to { transform: translateY(50%);  } }

  /* 星尘：细小光点摇曳上升 */
  .dust { position: absolute; inset: 0; }
  .dust i { position: absolute; width:3px; height:3px; border-radius:50%; background:#00d4aa; opacity:0; bottom:-8%; animation: rise linear infinite; }
  .dust i:nth-child(1) { left:12%; animation-duration:11s; animation-delay:0s; }
  .dust i:nth-child(2) { left:26%; width:2px; height:2px; animation-duration:14s; animation-delay:2.2s; }
  .dust i:nth-child(3) { left:40%; width:2px; height:2px; animation-duration:9s;  animation-delay:3.6s; }
  .dust i:nth-child(4) { left:58%; animation-duration:16s; animation-delay:1s; }
  .dust i:nth-child(5) { left:72%; width:2px; height:2px; animation-duration:12s; animation-delay:4.4s; }
  .dust i:nth-child(6) { left:86%; animation-duration:13s; animation-delay:5.2s; }
  .dust i:nth-child(7) { left:50%; width:2px; height:2px; animation-duration:15s; animation-delay:6.1s; }
  @keyframes rise {
    0%   { transform: translate3d(0,0,0) scale(1);         opacity:0; }
    12%  { opacity:.65; }
    50%  { transform: translate3d(12px,-54vh,0) scale(.7); opacity:.34; }
    86%  { opacity:.14; }
    100% { transform: translate3d(-8px,-108vh,0) scale(.5); opacity:0; }
  }

  /* ── 8 个智能体光点：从八方向汇聚于中心（带轨迹拖尾）── */
  .agents { position:absolute; left:50%; top:calc(50% - 96px); width:0; height:0; pointer-events:none; }
  .agents i {
    position:absolute; left:0; top:0; width:9px; height:9px; margin:-4.5px; border-radius:50%;
    background:#8ff0d6;
    box-shadow:0 0 16px 4px rgba(0,212,170,0.9), 0 0 40px 10px rgba(0,212,170,0.4);
    opacity:0;
    transform:translate(var(--sx), var(--sy)) scale(.4);
    animation: converge 1.05s cubic-bezier(.55,.06,.35,1) var(--d) both;
  }
  .agents i::after {
    content:''; position:absolute; left:50%; top:50%; width:56px; height:2px; margin-top:-1px; border-radius:2px;
    background:linear-gradient(90deg, rgba(0,212,170,0.75), transparent);
    transform-origin:0 50%; transform:rotate(var(--a)) translateX(5px);
  }
  .agents i:nth-child(1) { --sx:-46vw; --sy:-34vh; --a: 36deg;  --d:.12s; }
  .agents i:nth-child(2) { --sx: 46vw; --sy:-32vh; --a:145deg;  --d:.55s; }
  .agents i:nth-child(3) { --sx:-48vw; --sy: 30vh; --a:-32deg;  --d:.20s; }
  .agents i:nth-child(4) { --sx: 48vw; --sy: 34vh; --a:-145deg; --d:.66s; }
  .agents i:nth-child(5) { --sx:  0vw; --sy:-46vh; --a: 90deg;  --d:.34s; }
  .agents i:nth-child(6) { --sx:  0vw; --sy: 48vh; --a:-90deg;  --d:.27s; }
  .agents i:nth-child(7) { --sx:-50vw; --sy: -2vh; --a: 2deg;   --d:.72s; }
  .agents i:nth-child(8) { --sx: 50vw; --sy:  2vh; --a:178deg;  --d:.45s; }
  @keyframes converge {
    0%   { transform:translate(var(--sx), var(--sy)) scale(.4); opacity:0; }
    14%  { opacity:1; }
    85%  { opacity:1; }
    100% { transform:translate(0,0) scale(1.2); opacity:0; }
  }

  /* 汇聚爆闪：光点到齐瞬间全屏能量迸开（1.62s） */
  .blast {
    position:absolute; inset:0;
    background:radial-gradient(56% 56% at 50% 42%, rgba(0,212,170,0.8) 0%, rgba(0,212,170,0.2) 42%, transparent 70%);
    opacity:0;
    animation: blastBurst .8s cubic-bezier(.2,.8,.2,1) 1.8s forwards;
  }
  @keyframes blastBurst {
    0%   { opacity:0; transform:scale(.5);  filter:blur(12px); }
    28%  { opacity:1; }
    100% { opacity:0; transform:scale(1.75); filter:blur(0); }
  }

  /* 边缘压暗 + 中心聚焦 */
  .vignette {
    position:absolute; inset:0;
    background:
      radial-gradient(130% 95% at 50% 42%, rgba(0,212,170,0.12) 0%, transparent 46%),
      radial-gradient(125% 125% at 50% 50%, transparent 55%, rgba(2,5,10,0.8) 100%);
    animation: breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity:.6; transform:scale(1); }
    50%     { opacity:1;  transform:scale(1.05); }
  }

  /* ── 中心内容 ─────────────────────────────────────── */
  .hero {
    position: relative; display:flex; flex-direction:column; align-items:center;
    animation: heroPulse .55s cubic-bezier(.3,.7,.2,1) 1.82s both;
  }
  @keyframes heroPulse {
    0%   { transform:scale(.97); }
    45%  { transform:scale(1.015); }
    100% { transform:scale(1); }
  }
  .logo-wrap { width:128px; height:128px; position:relative; display:flex; align-items:center; justify-content:center; }
  .halo { position:absolute; inset:-26px; border-radius:50%; background:radial-gradient(circle, rgba(0,212,170,0.18) 0%, transparent 68%); animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow {
    0%,100% { opacity:.5; transform:scale(1); }
    50%     { opacity:1;  transform:scale(1.1); }
  }
  /* 冲击环：光点汇聚爆开后，双层级联 */
  .ring { position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(0,212,170,0.7); opacity:0; animation: ringBurst 1s cubic-bezier(.2,.7,.3,1) 1.8s forwards; }
  .ring.ring2 { inset:-14px; border-width:1px; border-color:rgba(0,212,170,0.35); animation-delay:1.92s; animation-duration:1.1s; }
  @keyframes ringBurst {
    0%   { transform:scale(.5);   opacity:.9; }
    100% { transform:scale(2.35); opacity:0; }
  }
  /* Logo：书本线条一笔一笔画出（写作），1.7s 起 */
  .logo { position:relative; z-index:1; width:84px; height:84px; filter:drop-shadow(0 6px 24px rgba(0,212,170,0.35)); }
  .logo .draw { stroke-dasharray:320; stroke-dashoffset:320; animation: drawIn 1.05s cubic-bezier(.5,.05,.35,1) forwards; }
  .logo .draw.d1 { animation-delay:1.88s; }
  .logo .draw.d2 { animation-delay:2.08s; animation-duration:.8s; }
  .logo .draw.d3 { animation-delay:2.26s; animation-duration:.6s; }
  .logo .fillin { opacity:0; animation: fadeIn .5s ease 2.63s forwards; }
  @keyframes drawIn { to { stroke-dashoffset:0; } }
  @keyframes fadeIn { to { opacity:.9; } }

  /* 品牌名：宽字距收拢展开 */
  .wordmark {
    margin-top:22px; font-size:46px; font-weight:800; letter-spacing:.34em; padding-left:.34em; line-height:1.18;
    background:linear-gradient(180deg, #ffffff 0%, #b9e7dd 70%, rgba(0,212,170,0.9) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    opacity:0;
    animation: wordIn .8s cubic-bezier(.25,1,.35,1) 2.63s both;
  }
  @keyframes wordIn {
    0%   { opacity:0; letter-spacing:.58em; transform:translateY(14px); filter:blur(6px); }
    60%  { opacity:1; }
    100% { opacity:1; letter-spacing:.34em; transform:translateY(0);    filter:blur(0); }
  }
  .tagline {
    margin-top:12px; font-size:12px; letter-spacing:.5em; padding-left:.5em; color:rgba(125,227,195,0.66);
    opacity:0; animation: fadeUp .7s ease 2.95s both;
    display:flex; align-items:center; gap:10px;
  }
  .tagline .ver { font-size:11px; letter-spacing:.12em; padding-left:.12em; color:rgba(159,176,196,0.75); font-family:'SF Mono','Consolas',monospace; }

  /* 阶段文案 */
  .status {
    margin-top:32px; font-size:13px; color:#9fb0c4; min-height:20px; letter-spacing:.05em;
    opacity:0; animation: fadeUp .7s ease 3.1s both;
    display:flex; align-items:center; gap:10px; transition:opacity .22s ease;
  }
  .status .pulse { width:7px; height:7px; border-radius:50%; background:#00d4aa; box-shadow:0 0 12px rgba(0,212,170,0.9); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink {
    0%,100% { opacity:.35; transform:scale(.8); }
    50%     { opacity:1;   transform:scale(1); }
  }

  /* 底部细线进度：汇聚光 */
  .progress {
    margin-top:18px; width:240px; height:2px; border-radius:2px; background:rgba(255,255,255,0.07); overflow:hidden; position:relative;
    opacity:0; animation: fadeUp .7s ease 3.25s both;
  }
  .progress .fill {
    height:100%; width:0%; border-radius:2px; background:linear-gradient(90deg,#00d4aa,#7de3c3); box-shadow:0 0 14px rgba(0,212,170,0.7);
    transition:width .6s cubic-bezier(.3,.8,.3,1);
  }
  .progress .sheen { position:absolute; inset:0; width:40%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent); transform:translateX(-120%); animation: sheen 1.5s ease-in-out infinite; }
  @keyframes sheen {
    0%,100% { transform:translateX(-140%); }
    55%,70% { transform:translateX(320%); }
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="stage">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="bg-grid"></div>
  <div class="lexicon left"><div class="rail">ABSTRACT · METHODOLOGY · HYPOTHESIS · CITATIONS · PEER REVIEW · ABSTRACT · METHODOLOGY · HYPOTHESIS · CITATIONS · PEER REVIEW · </div></div>
  <div class="lexicon right"><div class="rail">SCI · SSCI · CSSCI · EI · IMPACT FACTOR · PUBLICATION · SCI · SSCI · CSSCI · EI · IMPACT FACTOR · PUBLICATION · </div></div>
  <div class="vignette"></div>
  <div class="dust"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="agents"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="blast"></div>

  <div class="hero">
    <div class="logo-wrap">
      <div class="halo"></div>
      <div class="ring ring2"></div>
      <div class="ring"></div>
      <svg class="logo" viewBox="0 0 72 72" fill="none">
        <path class="draw d1" d="M12 18 Q12 12 18 12 L36 12 Q36 18 42 18 L60 18 Q66 18 66 24 L66 54 Q66 60 60 60 L18 60 Q12 60 12 54 Z"
              fill="none" stroke="#00d4aa" stroke-width="2.6" stroke-linejoin="round"/>
        <path class="draw d2" d="M36 12 L36 48 Q36 54 30 54 L18 54"
              fill="none" stroke="#00d4aa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="fillin" d="M48 30 Q54 30 54 36 Q54 42 48 42 Q44 42 44 36 Q44 30 48 30 Z" fill="#00d4aa"/>
        <path class="draw d3" d="M48 42 L48 52" stroke="#00d4aa" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="wordmark">Sage</div>
    <div class="tagline">多智能体学术写作<span class="ver" id="version"></span></div>
    <div class="status"><span class="pulse"></span><span id="status">正在初始化...</span></div>
    <div class="progress"><div class="fill" id="fill"></div><div class="sheen"></div></div>
  </div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const versionEl = document.getElementById('version');
  const params = new URLSearchParams(location.search);
  versionEl.textContent = params.get('v') ? `v${params.get('v')}` : '';
  if (!versionEl.textContent.trim()) versionEl.style.display = 'none';

  const PROGRESS_STEPS = { 初始化:8, 核心服务:34, 智能体引擎:58, 记忆系统:80, 工作台:96 };
  const fillEl = document.getElementById('fill');
  let current = 0;
  function tweenProgress(to) {
    if (!fillEl) return;
    if (to <= current) return;
    fillEl.style.width = to + '%';
    current = to;
  }
  function setStatus(text) {
    statusEl.style.opacity = '0';
    setTimeout(() => { statusEl.textContent = text; statusEl.style.opacity = '1'; }, 200);
  }
  if (window.electronAPI && window.electronAPI.onSplashStatus) {
    window.electronAPI.onSplashStatus((text) => {
      const key = Object.keys(PROGRESS_STEPS).find(k => text.indexOf(k) >= 0);
      if (key) { tweenProgress(PROGRESS_STEPS[key]); }
      else { tweenProgress(Math.min(current + 4, 60)); }
      setStatus(text);
    });
  }
</script>
</body>
</html>
